<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ article.title }} | Strikeblade</title>
  <style>
    :root {
      --text: #ece6d8;
      --muted: #aaa59b;
      --line: rgba(236, 230, 216, 0.14);
      --panel: rgba(236, 230, 216, 0.06);
      --max: 980px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 7%, rgba(236, 230, 216, 0.08), transparent 28rem),
        linear-gradient(rgba(236, 230, 216, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 230, 216, 0.032) 1px, transparent 1px),
        linear-gradient(180deg, #151411 0%, #0e0d0b 52%, #12110e 100%);
      background-size: 100% 100%, 72px 72px, 72px 72px, 100% 100%;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 72px;
      padding: 0 max(16px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid rgba(236, 230, 216, 0.08);
      background: rgba(15, 14, 12, 0.76);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      object-fit: cover;
      object-position: center 43%;
      border: 1px solid rgba(236, 230, 216, 0.18);
      background: #12110e;
      filter: grayscale(0.25) sepia(0.08) contrast(0.98) brightness(0.9);
    }

    .links {
      display: flex;
      gap: 22px;
      color: var(--muted);
    }

    main {
      width: min(100% - 32px, var(--max));
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    .article-title {
      margin: 0 0 28px;
      font-size: clamp(2.4rem, 6vw, 4.8rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
    }

    .article-content {
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(236, 230, 216, 0.045), transparent 48%),
        var(--panel);
      backdrop-filter: blur(16px);
      padding: clamp(22px, 5vw, 48px);
      color: #d8d0c1;
      font-size: 1.05rem;
      line-height: 1.9;
    }

    .article-content h2,
    .article-content h3 {
      color: var(--text);
      line-height: 1.25;
      margin: 1.35em 0 0.45em;
    }

    .article-content p {
      margin: 0 0 1em;
    }

    .article-content img {
      display: block;
      width: auto;
      max-width: min(100%, 640px);
      max-height: min(52vh, 520px);
      height: auto;
      object-fit: contain;
      margin: 22px auto;
      border: 1px solid var(--line);
      background: rgba(236, 230, 216, 0.04);
      filter: grayscale(0.65) sepia(0.12) contrast(1.04) brightness(0.94);
    }

    .article-content img.article-image-small {
      max-width: min(100%, 420px);
      max-height: min(44vh, 380px);
    }

    .article-content img.article-image-wide {
      max-width: min(100%, 760px);
      max-height: min(56vh, 560px);
    }

    @media (max-width: 720px) {
      .nav {
        display: grid;
        gap: 12px;
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .links {
        flex-wrap: wrap;
        gap: 12px;
      }

      .article-content img,
      .article-content img.article-image-small,
      .article-content img.article-image-wide {
        max-width: 100%;
        max-height: 46vh;
      }
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site-watermark.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-nav.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}"><img class="brand-logo" src="{{ url_for('static', filename='images/mainpage_images/image.png') }}" alt="" aria-hidden="true"> <span>Strikeblade</span></a>
    <input class="nav-toggle" id="nav-toggle" type="checkbox" aria-label="打开导航菜单">
    <label class="nav-toggle-label" for="nav-toggle" aria-hidden="true"><span></span></label>
    <nav class="links">
      <a href="{{ url_for('index') }}">首页</a>
      <a href="{{ url_for('buying_guide') }}">购买须知</a>
      <a href="{{ url_for('all_products') }}">全部产品</a>
      <a href="{{ url_for('custom') }}">定制</a>
      <a href="{{ url_for('research') }}">文章/研究</a>
      <a href="{{ url_for('contact') }}">联系</a>
    </nav>
  </header>

  <main>
    <h1 class="article-title">{{ article.title }}</h1>
    <article class="article-content">
      {{ article.content_html|safe }}
    </article>
  </main>
</body>
</html>
