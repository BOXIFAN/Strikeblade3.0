<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | Strikeblade</title>
  <style>
    :root {
      --text: #ece6d8;
      --muted: #aaa59b;
      --line: rgba(236, 230, 216, 0.14);
      --panel: rgba(236, 230, 216, 0.06);
      --max: 980px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 7%, rgba(236, 230, 216, 0.08), transparent 28rem),
        linear-gradient(rgba(236, 230, 216, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 230, 216, 0.032) 1px, transparent 1px),
        linear-gradient(180deg, #151411 0%, #0e0d0b 52%, #12110e 100%);
      background-size: 100% 100%, 72px 72px, 72px 72px, 100% 100%;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 72px;
      padding: 0 max(16px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid rgba(236, 230, 216, 0.08);
      background: rgba(15, 14, 12, 0.76);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      object-fit: cover;
      object-position: center 43%;
      border: 1px solid rgba(236, 230, 216, 0.18);
      background: #12110e;
      filter: grayscale(0.25) sepia(0.08) contrast(0.98) brightness(0.9);
    }

    .links {
      display: flex;
      gap: 22px;
      color: var(--muted);
    }

    main {
      width: min(100% - 32px, var(--max));
      margin: 0 auto;
      padding: 120px 0;
    }

    .panel {
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(236, 230, 216, 0.045), transparent 48%),
        var(--panel);
      backdrop-filter: blur(16px);
      padding: clamp(24px, 5vw, 48px);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 28px;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1;
    }

    p {
      color: #cfc8bb;
      font-size: 1.05rem;
      line-height: 1.9;
    }

    @media (max-width: 680px) {
      .nav {
        display: grid;
        gap: 12px;
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .links {
        flex-wrap: wrap;
        gap: 12px;
      }
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site-watermark.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-nav.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}"><img class="brand-logo" src="{{ url_for('static', filename='images/mainpage_images/image.png') }}" alt="" aria-hidden="true"> <span>Strikeblade</span></a>
    <input class="nav-toggle" id="nav-toggle" type="checkbox" aria-label="打开导航菜单">
    <label class="nav-toggle-label" for="nav-toggle" aria-hidden="true"><span></span></label>
    <nav class="links">
      <a href="{{ url_for('index') }}">首页</a>
      <a href="{{ url_for('buying_guide') }}">购买须知</a>
      <a href="{{ url_for('all_products') }}">全部产品</a>
      <a href="{{ url_for('custom') }}">定制</a>
      <a href="{{ url_for('research') }}">文章/研究</a>
      <a href="{{ url_for('contact') }}">联系</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <div class="eyebrow">{{ eyebrow }}</div>
      <h1>{{ title }}</h1>
      {% for paragraph in body %}
      <p>{{ paragraph }}</p>
      {% endfor %}
    </section>
  </main>
</body>
</html>
